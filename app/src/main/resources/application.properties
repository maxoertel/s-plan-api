spring.application.name=s-plan-api
spring.config.import=optional:file:.env[.properties]

server.port=6033

# s-plan | s-work
app.mode=${APP_MODE}

# Main application database (shared by every data source).
spring.datasource.url=${MAIN_DB_URL}
spring.datasource.username=${MAIN_DB_USER}
spring.datasource.password=${MAIN_DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# Canonical zone used to encode/decode the timezone-naive TIMESTAMP columns of the legacy schema.
# Required: no default — startup fails if APP_DB_TIMEZONE is not set, forcing an explicit decision.
app.db-timezone=${APP_DB_TIMEZONE}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE}

management.server.port=-1
management.endpoints.web.exposure.exclude=*

management.otlp.metrics.export.enabled=true
management.otlp.metrics.export.url=${OTLP_ENDPOINT}
management.otlp.metrics.export.headers.Authorization=Basic ${OTLP_AUTH_BASE64}
management.otlp.metrics.export.step=60s
management.otlp.metrics.export.aggregation-temporality=cumulative

management.metrics.tags.env=${APP_ENV}
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

logging.level.org.springframework.web.servlet.mvc.method.annotation.HttpEntityMethodProcessor=INFO